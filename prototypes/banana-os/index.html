<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Banana OS — Prototype</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#17345c;background:#f2f5f9}header{background:#17345c;color:white;padding:24px}header strong{color:#f5d34b}main{max-width:1100px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:12px;background:white;color:#17345c;cursor:pointer}button[aria-selected=true]{background:#17345c;color:white}button:focus-visible{outline:3px solid #c39200}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:white;border:1px solid #dce3ec;border-radius:14px;padding:20px}h2{margin-top:0}small{color:#52657b}aside{padding:14px;border-left:4px solid #e7ba31;background:white;margin-bottom:20px}footer{padding:24px;color:#52657b}
</style><header><strong>BANANA</strong> OS <span>· Direction</span></header><main><aside>Prototype isolé — aucune donnée réelle, aucune connexion ni écriture. L'accès à la version opérationnelle devra être authentifié côté serveur.</aside><nav aria-label="Rubriques" id="nav"></nav><section id="panel" aria-live="polite"></section></main><footer>Banana OS · Prévisualisation de développement</footer><script>
const sections=[["Accueil",["Trésorerie vérifiée","Engagements à venir","Résultat réel","Actions prioritaires"]],["Opérations",["Demandes clients","Commandes et achats","Livraisons","Rapprochement et clôture"]],["Finance",["Journal des transactions","Marges réelles","Charges et fiscalité","Prévisions de liquidité","Réserves et placements","Rémunération"]],["Réseau",["Clients et chantiers","Prospects","Fournisseurs","Transporteurs","Tarifs datés"]],["Documents",["Production","Validation explicite","Archives","Anomalies"]],["Intelligence",["Finance","Documents","Opérations","Marché","Croissance"]]];const nav=document.querySelector('#nav'),panel=document.querySelector('#panel');function show(i){for(const [j,b] of [...nav.children].entries())b.setAttribute('aria-selected',String(i===j));panel.replaceChildren();const h=document.createElement('h2');h.textContent=sections[i][0];panel.append(h);const grid=document.createElement('div');grid.className='grid';for(const name of sections[i][1]){const a=document.createElement('article'),t=document.createElement('h3'),s=document.createElement('small');t.textContent=name;s.textContent='Source à connecter — aucune valeur estimée';a.append(t,s);grid.append(a)}panel.append(grid)}sections.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(i);nav.append(b)});show(0);
</script></html>
